<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Enlace Digital</title>
    <link rel="shortcut icon" href="../midia/logos/logo-com-texto.jpg" type="image/x-icon">

    <!-- Estilos: base (cores e fonte) + componentes (botão) + o que é só destas telas -->
    <link rel="stylesheet" href="../estilos/base.css">
    <link rel="stylesheet" href="../estilos/componentes.css">
    <link rel="stylesheet" href="../estilos/autenticacao.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="pagina-autenticacao">
    <main class="autenticacao">

        <!-- Lado esquerdo: formulário -->
        <section class="painel-formulario">
            <div class="moldura">
                <div class="cartao-auth">
                    <a class="voltar-seta" href="../index.html" aria-label="Voltar para o início">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg>
                    </a>
                    <img class="logo-auth" src="../midia/logos/logo-enlace-digital.png" width="511" height="120" alt="Enlace Digital">
                    <h1 class="so-leitor">Cadastro</h1>

                    <p id="errosCadastro" role="alert"></p>

                    <form class="formulario-auth" data-destino="../index.html">
                        <label class="so-leitor" for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>

                        <label class="so-leitor" for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu email" autocomplete="email" required>

                        <label class="so-leitor" for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="new-password" minlength="8" required>

                        <label class="so-leitor" for="confirmar-senha">Confirmar senha</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme sua senha" autocomplete="new-password" minlength="8" required>

                        <a class="link-auth" href="login.html">já tenho uma conta</a>

                        <button class="botao botao-destaque" type="submit">Cadastrar</button>
                    </form>
                </div>
            </div>
        </section>

        <!-- Lado direito: foto da sala de aula com a moldura roxa por cima (só no computador) -->
        <aside class="painel-imagem" aria-hidden="true">
            <img src="../midia/conteudo/moldura-login.png" alt="">
        </aside>

    </main>
    <script src="../scripts/api.js"></script>
    <script src="../scripts/autenticacao.js"></script>
    <script src="../scripts/cadastro.js"></script>
</body>
</html>
